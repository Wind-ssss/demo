<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="个人作品集">
  <meta name="theme-color" content="#f7f6f2">
  <title>作品集</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a class="brand" href="#top"><span class="ph">[ 张锦程 ]</span><span class="brand-dot">.</span></a>

      <nav class="nav" id="nav" aria-label="主导航">
        <a href="#work" class="nav-link">作品</a>
        <a href="#about" class="nav-link">关于</a>
        <a href="#contact" class="nav-link">联系</a>
      </nav>

      <div class="header-actions">
        <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="切换深浅色主题" title="切换主题">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.6 8.6 0 1 0 10.7 10.7z"/>
          </svg>
        </button>
        <button class="icon-btn menu-toggle" id="menuToggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="nav">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <p class="section-index reveal">PORTFOLIO</p>
        <h1 class="reveal">你好，<br>这里是<span class="serif-accent">我的作品</span>。</h1>
        <p class="hero-desc ph reveal">[ 一句话介绍你自己 ]</p>
        <a class="btn btn-primary reveal" href="#work">查看作品 →</a>
      </div>
    </section>

    <section class="section" id="work">
      <div class="container">
        <div class="section-head reveal">
          <p class="section-index">01 / WORK</p>
          <h2>作品<span class="heading-dot">.</span></h2>
        </div>
        <div class="filters reveal" id="filters" role="group" aria-label="筛选作品"></div>
        <div class="work-grid" id="workGrid"></div>
        <p class="work-empty ph" id="workEmpty" hidden>这个分类下暂时没有项目。</p>
      </div>
    </section>

    <section class="section section-soft" id="about">
      <div class="container about-inner reveal">
        <div>
          <p class="section-index">02 / ABOUT</p>
          <h2>关于<span class="heading-dot">.</span></h2>
        </div>
        <div class="about-text">
          <p class="ph">[ 在这里写关于你自己的介绍 ]</p>
          <p class="ph">[ 擅长什么、做过什么、想做什么 ]</p>
        </div>
      </div>
    </section>

    <section class="section section-contact" id="contact">
      <div class="container contact-inner reveal">
        <p class="section-index">03 / CONTACT</p>
        <h2>联系<span class="heading-dot">.</span></h2>
        <a class="contact-mail" href="mailto:">[ 你的邮箱 ]</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span id="year">2026</span> <span class="ph">[ 张锦程 ]</span></span>
      <a href="#top">回到顶部 ↑</a>
    </div>
  </footer>

  <div class="modal" id="projectModal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" type="button" data-close aria-label="关闭详情">×</button>
      <div class="modal-cover" id="modalCover"></div>
      <div class="modal-body">
        <p class="modal-kicker" id="modalKicker"></p>
        <h3 id="modalTitle"></h3>
        <p class="modal-desc ph" id="modalDesc"></p>
        <a class="modal-link" id="modalLink" target="_blank" rel="noopener noreferrer" hidden>打开项目链接 ↗</a>
      
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
